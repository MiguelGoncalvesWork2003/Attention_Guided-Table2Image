data:
  raw_csv: data/raw/Iris.csv
  processed_dir: data/processed

tabnet:
  n_steps: 5
  gamma: 1.5
  lambda_sparse: 0.0001
  lr: 0.02
  max_epochs: 100
  patience: 20
  batch_size: 32
  virtual_batch_size: 16

cnn:
  lr: 0.001
  batch_size: 16
  epochs: 30
  n_classes: 3

output_dirs:
  tabnet_outputs: tabnet_fs/outputs
  model_checkpoint: cnn/cnn_model.pth
